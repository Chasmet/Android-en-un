name: CHK Alien Live - APK Android (voix 0.4)
on:
  push:
    branches: [chk-alien-live-build-20261121]
    paths:
      - "chk-alien-live/**"
      - ".github/workflows/chk-alien-live-build.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: SDK Android 34
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - name: Contrôles sources
        working-directory: chk-alien-live
        run: |
          python3 tools/verify_source.py
          javac tools/ParseJavaSources.java
          java -cp tools ParseJavaSources
      - name: Assembler APK Android
        working-directory: chk-alien-live
        run: bash ./gradlew --no-daemon --stacktrace assembleDebug
      - name: Archiver le véritable APK
        uses: actions/upload-artifact@v4
        with:
          name: CHK-Alien-Live-APK-Android-v0.4
          path: chk-alien-live/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
