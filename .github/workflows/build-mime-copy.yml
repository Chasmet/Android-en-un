name: Build Mime Copy APK

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          base64 -d mime-copy-app.tar.gz.b64 > mime-copy-app.tar.gz
          tar -xzf mime-copy-app.tar.gz

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate Gradle wrapper
        working-directory: mime-copy-app
        run: gradle wrapper --gradle-version 8.7

      - name: Build debug APK
        working-directory: mime-copy-app
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mime-Copy-APK
          path: mime-copy-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
